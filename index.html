<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Proyecto</title>
<style>
  :root{
    --bg:#0a0a0a;
    --fg:#f2f2f2;
    --accent:#ffffff;
    --travel: 42vw;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    overflow-x:hidden;
  }

  /* ---------- SECCION 1: VIDEO ---------- */
  #intro{
    position:relative;
    height:100vh;
    width:100%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #intro video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
    backface-visibility:hidden;
    transform:translateZ(0);
  }
  /* Sombra suave SOLO donde va el texto, para no apagar todo el video */
  #intro::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 60% 45% at 78% 82%, rgba(0,0,0,.55), transparent 70%),
      linear-gradient(to top, rgba(0,0,0,.35) 0%, transparent 35%);
    z-index:1;
    pointer-events:none;
  }

  /* ---------- CONTROL DE SONIDO ---------- */
  .sound{
    position:absolute;
    z-index:3;
    left:6vw;
    bottom:14vh;
    display:inline-flex;
    align-items:center;
    gap:.7rem;
    cursor:pointer;
    background:none;
    border:none;
    color:var(--fg);
    font:inherit;
    opacity:.65;
    transition:opacity .35s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .sound:hover,.sound:focus-visible{opacity:1;outline:none}
  .sound__icon{
    width:34px;height:34px;
    border:1px solid currentColor;
    border-radius:50%;
    display:grid;place-items:center;
    flex:none;
  }
  .sound__icon svg{width:15px;height:15px;display:block}
  .sound__text{
    font-size:.7rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    white-space:nowrap;
  }
  /* pulso mientras esta silenciado, para invitar al clic */
  .sound.is-muted .sound__icon{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}
    50%{box-shadow:0 0 0 9px rgba(255,255,255,0)}
  }

  /* ---------- INTERACCION: RECORRIDO HACIA LA IZQUIERDA ---------- */
  .travel-wrap{
    position:absolute;
    z-index:2;
    right:6vw;
    bottom:14vh;
    animation:travelLeft 2.6s cubic-bezier(.16,.84,.24,1) .8s both;
  }
  @keyframes travelLeft{
    0%{transform:translateX(var(--travel));opacity:0;filter:blur(6px)}
    60%{opacity:1;filter:blur(0)}
    100%{transform:translateX(0);opacity:1;filter:blur(0)}
  }

  .go{
    display:inline-flex;
    align-items:center;
    gap:1rem;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    padding:.4rem 0;
    background:none;
    border:none;
    color:inherit;
    font:inherit;
    text-decoration:none;
  }
  .go__label{
    font-size:clamp(1.1rem,2.4vw,1.9rem);
    font-weight:300;
    letter-spacing:.22em;
    text-transform:uppercase;
    position:relative;
    padding-bottom:.35rem;
    white-space:nowrap;
  }
  .go__label::after{
    content:"";
    position:absolute;
    left:0;bottom:0;
    height:1px;
    width:100%;
    background:var(--accent);
    transform:scaleX(0);
    transform-origin:right center;
    transition:transform .6s cubic-bezier(.16,.84,.24,1);
  }
  .go:hover .go__label::after,
  .go:focus-visible .go__label::after{transform:scaleX(1)}

  .go__arrow{
    width:clamp(48px,7vw,86px);
    height:1px;
    background:var(--accent);
    position:relative;
    opacity:.75;
    transition:opacity .4s ease, transform .6s cubic-bezier(.16,.84,.24,1);
    animation:nudge 2.2s ease-in-out infinite;
  }
  .go__arrow::before{
    content:"";
    position:absolute;
    left:0;top:50%;
    width:10px;height:10px;
    border-left:1px solid var(--accent);
    border-bottom:1px solid var(--accent);
    transform:translateY(-50%) rotate(45deg);
  }
  @keyframes nudge{
    0%,100%{transform:translateX(0)}
    50%{transform:translateX(-14px)}
  }
  .go:hover .go__arrow,
  .go:focus-visible .go__arrow{
    opacity:1;
    transform:translateX(-22px);
    animation-play-state:paused;
  }
  .go:focus-visible{outline:none}

  @media (prefers-reduced-motion:reduce){
    .travel-wrap{animation:none}
    .go__arrow{animation:none}
    .sound.is-muted .sound__icon{animation:none}
    html{scroll-behavior:auto}
  }

  /* En pantallas angostas, el control de sonido sube para no chocar */
  @media (max-width:620px){
    .sound{bottom:24vh}
    .sound__text{display:none}
  }

  /* ---------- SECCION 2: DESTINO ---------- */
  #sector-2{
    min-height:100vh;
    padding:14vh 6vw;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:1.5rem;
    background:#0f0f0f;
  }
  #sector-2 h2{
    font-size:clamp(2rem,6vw,4.5rem);
    font-weight:200;
    letter-spacing:.04em;
  }
  #sector-2 p{
    max-width:60ch;
    line-height:1.7;
    opacity:.7;
    font-weight:300;
  }
  .back{
    margin-top:2rem;
    font-size:.8rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    opacity:.5;
    text-decoration:none;
    color:inherit;
    transition:opacity .3s ease;
  }
  .back:hover{opacity:1}
</style>
</head>
<body>

  <!-- ====== SECCION 1 - VIDEO ====== -->
  <section id="intro">
    <video id="bgVideo"
      src="assets/video.mp4"
      autoplay
      muted
      loop
      playsinline
      preload="auto">
    </video>

    <!-- Control de sonido -->
    <button class="sound is-muted" id="soundBtn" type="button" aria-label="Activar sonido">
      <span class="sound__icon" aria-hidden="true">
        <svg id="iconMuted" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H2v6h4l5 4z"/>
          <line x1="23" y1="9" x2="17" y2="15"/>
          <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
        <svg id="iconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" hidden>
          <path d="M11 5 6 9H2v6h4l5 4z"/>
          <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
          <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
        </svg>
      </span>
      <span class="sound__text" id="soundText">Activar sonido</span>
    </button>

    <!-- Interaccion con recorrido hacia la izquierda -->
    <div class="travel-wrap">
      <a class="go" href="#sector-2" aria-label="Ir a la siguiente seccion">
        <span class="go__arrow" aria-hidden="true"></span>
        <span class="go__label">Continuar</span>
      </a>
    </div>
  </section>

  <!-- ====== SECCION 2 - DESTINO ====== -->
  <section id="sector-2">
    <h2>Sector dos</h2>
    <p>
      Aqui va el contenido al que lleva la interaccion. Esta seccion es el
      destino del desplazamiento suave; puedes reemplazar todo su interior sin
      tocar nada de la seccion del video.
    </p>
    <a class="back" href="#intro">volver al inicio</a>
  </section>

<script>
(function(){
  var v     = document.getElementById('bgVideo');
  var btn   = document.getElementById('soundBtn');
  var icOff = document.getElementById('iconMuted');
  var icOn  = document.getElementById('iconOn');
  var label = document.getElementById('soundText');
  if(!v) return;

  v.addEventListener('error', function(){
    console.error('[video] no se pudo cargar:', v.currentSrc || v.src);
  });

  /* El navegador SOLO permite arrancar solo si esta silenciado.
     Arrancamos mudo y activamos el audio en la primera interaccion. */
  function play(){
    var p = v.play();
    if(p && p.catch) p.catch(function(e){
      console.warn('[video] autoplay bloqueado:', e.name);
    });
  }

  function render(){
    var muted = v.muted;
    btn.classList.toggle('is-muted', muted);
    icOff.hidden = !muted;
    icOn.hidden  = muted;
    label.textContent = muted ? 'Activar sonido' : 'Silenciar';
    btn.setAttribute('aria-label', muted ? 'Activar sonido' : 'Silenciar');
  }

  function unmute(){
    v.muted = false;
    v.volume = 1;
    play();
    render();
  }

  /* Boton: alterna el sonido */
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    v.muted = !v.muted;
    if(!v.muted) v.volume = 1;
    play();
    render();
  });

  /* Primera interaccion en cualquier parte: activa el sonido */
  function firstTouch(e){
    if(btn.contains(e.target)) return;
    unmute();
    document.removeEventListener('click', firstTouch);
    document.removeEventListener('touchstart', firstTouch);
    document.removeEventListener('keydown', firstTouch);
  }
  document.addEventListener('click', firstTouch);
  document.addEventListener('touchstart', firstTouch);
  document.addEventListener('keydown', firstTouch);

  play();
  render();
})();
</script>

</body>
</html>
